<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiet Monitor</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #root { width: 100%; }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    /* Header */
    .header { text-align: center; }
    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #a8b4ff;
    }
    .header p {
      margin-top: 0.4rem;
      font-size: 0.85rem;
      color: #6b7280;
    }

    /* Meter circle */
    .meter-wrap {
      position: relative;
      width: 220px;
      height: 220px;
    }
    .meter-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .meter-bg {
      fill: none;
      stroke: #16213e;
      stroke-width: 14;
    }
    .meter-fill {
      fill: none;
      stroke-width: 14;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.12s ease-out, stroke 0.2s ease;
    }
    .meter-threshold {
      fill: none;
      stroke: rgba(255,255,255,0.25);
      stroke-width: 3;
      stroke-dasharray: 6 4;
      stroke-linecap: round;
    }
    .meter-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
    }
    .meter-db {
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }
    .meter-label {
      font-size: 0.75rem;
      color: #6b7280;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .meter-status {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
      margin-top: 0.3rem;
    }
    .meter-status.ok    { background: rgba(52,211,153,0.15); color: #34d399; }
    .meter-status.warn  { background: rgba(251,191,36,0.15);  color: #fbbf24; }
    .meter-status.loud  { background: rgba(239,68,68,0.15);   color: #ef4444; }

    /* Bars visualizer */
    .bars {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 3px;
      height: 40px;
      width: 100%;
    }
    .bar {
      width: 6px;
      border-radius: 3px 3px 0 0;
      background: #a8b4ff;
      transition: height 0.07s ease-out, background 0.2s;
      min-height: 2px;
    }

    /* Controls */
    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .control-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #9ca3af;
    }
    .control-label span:last-child { color: #a8b4ff; font-weight: 600; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #16213e;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #a8b4ff;
      border: 2px solid #1a1a2e;
      box-shadow: 0 0 6px rgba(168,180,255,0.5);
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #a8b4ff;
      border: 2px solid #1a1a2e;
      cursor: pointer;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 0.7rem 1rem;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.02em;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: #a8b4ff;
      color: #1a1a2e;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; }

    .btn-calibrate {
      background: #16213e;
      color: #a8b4ff;
      border: 1.5px solid #a8b4ff44;
    }
    .btn-calibrate:hover:not(:disabled) { background: #1e2d50; }
    .btn-calibrate.running {
      border-color: #fbbf24;
      color: #fbbf24;
      animation: pulse-border 1s infinite;
    }
    @keyframes pulse-border {
      0%, 100% { border-color: #fbbf2488; }
      50%       { border-color: #fbbf24; }
    }

    /* Calibration overlay */
    .calibrate-info {
      width: 100%;
      background: #16213e;
      border: 1.5px solid #fbbf2433;
      border-radius: 10px;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .calibrate-countdown {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fbbf24;
      min-width: 2ch;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .calibrate-text { font-size: 0.82rem; color: #9ca3af; line-height: 1.4; }
    .calibrate-bar-wrap {
      width: 100%;
      height: 4px;
      background: #0f172a;
      border-radius: 2px;
      overflow: hidden;
    }
    .calibrate-bar {
      height: 100%;
      background: #fbbf24;
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    /* Permission error */
    .mic-error {
      background: #2d1515;
      border: 1.5px solid #ef444433;
      border-radius: 10px;
      padding: 1rem;
      font-size: 0.82rem;
      color: #fca5a5;
      text-align: center;
      line-height: 1.5;
    }
    .mic-error strong { display: block; margin-bottom: 0.3rem; color: #ef4444; }

    /* Footer note */
    .footer-note {
      font-size: 0.72rem;
      color: #374151;
      text-align: center;
    }

    /* ── Setup screen ─────────────────────────────── */
    .setup-card {
      width: 100%;
      background: #16213e;
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .setup-card-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b7280;
    }
    .slider-hints {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: #4b5563;
      margin-top: 0.15rem;
    }
    .mode-cards { display: flex; flex-direction: column; gap: 0.55rem; }
    .mode-card {
      background: #0f172a;
      border: 1.5px solid #1e293b;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .mode-card:hover   { border-color: #a8b4ff44; background: #131d35; }
    .mode-card.selected { border-color: #a8b4ff; background: #1a2540; }
    .mode-emoji { font-size: 1.5rem; flex-shrink: 0; }
    .mode-label { font-size: 0.88rem; font-weight: 600; color: #e0e0e0; }
    .mode-desc  { font-size: 0.73rem; color: #6b7280; line-height: 1.4; margin-top: 0.1rem; }

    /* ── Monitor layout ───────────────────────────── */
    .monitor-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .btn-icon {
      background: none;
      border: 1.5px solid #374151;
      color: #6b7280;
      border-radius: 8px;
      width: 36px; height: 36px;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-icon:hover { border-color: #ef4444; color: #ef4444; }
    .monitor-footer {
      width: 100%;
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }

    /* ── Punishment panels ────────────────────────── */
    .punish-panel {
      width: 100%;
      background: #16213e;
      border-radius: 12px;
      padding: 1.3rem 1.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      border: 1.5px solid #1e293b;
    }
    .punish-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b7280;
    }
    .punish-time {
      font-size: 3rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: #e0e0e0;
    }
    .punish-sub { font-size: 0.78rem; color: #6b7280; text-align: center; }
    .punish-flash-msg {
      font-size: 0.85rem;
      font-weight: 700;
      color: #ef4444;
      animation: fadeUp 2s ease-out forwards;
    }
    @keyframes fadeUp {
      0%   { opacity: 1; transform: translateY(0); }
      70%  { opacity: 1; transform: translateY(-5px); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
    .flash-red { animation: flashRed 0.35s ease-out 4; }
    @keyframes flashRed {
      0%,100% { color: #e0e0e0; }
      50%      { color: #ef4444; }
    }
    .text-red   { color: #ef4444 !important; }
    .text-green { color: #34d399 !important; }
    .punish-pausa.blocked {
      border-color: #ef444433;
      animation: pulsePanel 1.4s infinite;
    }
    @keyframes pulsePanel {
      0%,100% { border-color: #ef444422; }
      50%      { border-color: #ef444466; }
    }

    /* Traffic light */
    .punish-semaforo { flex-direction: row; justify-content: center; gap: 2rem; }
    .traffic-light {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      background: #0f172a;
      border-radius: 20px;
      padding: 10px 10px;
      border: 2px solid #1e293b;
    }
    .tl-light {
      width: 38px; height: 38px;
      border-radius: 50%;
      transition: background 0.2s, box-shadow 0.25s;
    }
    .tl-red    { background: #ef444422; }
    .tl-yellow { background: #fbbf2422; }
    .tl-green  { background: #34d39922; }
    .tl-red.on    { background: #ef4444; box-shadow: 0 0 14px #ef4444bb; }
    .tl-yellow.on { background: #fbbf24; box-shadow: 0 0 14px #fbbf24bb; }
    .tl-green.on  { background: #34d399; box-shadow: 0 0 14px #34d399bb; }

    /* Points */
    .semaforo-points { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }
    .points-display  { display: flex; align-items: baseline; gap: 0.15rem; }
    .points-num   { font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
    .points-total { font-size: 1.1rem; color: #4b5563; font-weight: 600; }
    .points-dots  {
      display: flex; gap: 5px; flex-wrap: wrap;
      justify-content: center; max-width: 160px; margin-top: 0.2rem;
    }
    .point-dot { width: 10px; height: 10px; border-radius: 50%; background: #1e293b; transition: background 0.3s; }
    .point-dot.filled { background: #a8b4ff; }

    /* Punti esauriti */
    .punish-esauriti {
      border-color: #ef444455 !important;
      animation: pulsePanel 1.4s infinite;
    }
    .esauriti-icon { font-size: 2.2rem; }
    .esauriti-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ef4444;
      letter-spacing: 0.02em;
    }
    .esauriti-msg {
      font-size: 0.82rem;
      color: #9ca3af;
      text-align: center;
      line-height: 1.6;
    }

    /* ── Display view (seconda finestra) ──────────────── */
    .display-screen {
      min-height: 100vh;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 2rem;
      gap: 2rem;
      position: relative;
    }
    .display-waiting { text-align: center; gap: 1rem; }
    .display-waiting-icon { font-size: 3rem; }
    .display-waiting-text { font-size: 1.6rem; font-weight: 700; color: #a8b4ff; }
    .display-waiting-sub  { font-size: 0.9rem; color: #6b7280; }

    .display-header {
      width: 100%; max-width: 860px;
      display: flex; align-items: center; gap: 1.2rem;
    }
    .display-bar-wrap {
      flex: 1; height: 14px;
      background: #16213e; border-radius: 7px;
      position: relative; overflow: visible;
    }
    .display-bar {
      height: 100%; border-radius: 7px;
      transition: width 0.08s ease-out, background 0.2s;
    }
    .display-threshold-tick {
      position: absolute; top: -5px;
      width: 3px; height: 24px;
      background: rgba(255,255,255,0.35);
      border-radius: 2px; transform: translateX(-50%);
    }
    .display-db {
      font-size: 1.6rem; font-weight: 800;
      font-variant-numeric: tabular-nums;
      min-width: 5.5ch; text-align: right;
      transition: color 0.2s;
    }

    .display-status {
      font-size: clamp(3rem, 9vw, 6.5rem);
      font-weight: 900; letter-spacing: 0.06em;
      text-align: center;
    }
    .display-status-ok   { color: #34d399; }
    .display-status-warn { color: #fbbf24; animation: dPulse 1s infinite; }
    .display-status-loud { color: #ef4444; animation: dPulse 0.45s infinite; }
    @keyframes dPulse { 0%,100%{opacity:1} 50%{opacity:0.55} }

    .display-panel {
      width: 100%; max-width: 720px;
      background: #16213e; border-radius: 22px;
      padding: 2rem 2.5rem;
      display: flex; flex-direction: column;
      align-items: center; gap: 0.8rem;
      border: 2px solid #1e293b;
    }
    .display-mode-label {
      font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em; color: #6b7280;
    }
    .display-big-time {
      font-size: clamp(4.5rem, 14vw, 9.5rem);
      font-weight: 900; font-variant-numeric: tabular-nums;
      line-height: 1; color: #fff;
    }
    .display-sub  { font-size: 1rem; color: #6b7280; text-align: center; }
    .display-done { font-size: 3rem; font-weight: 900; color: #34d399; }
    .display-esauriti { font-size: 2.8rem; font-weight: 900; color: #ef4444; }
    .display-flash-msg {
      font-size: 1.6rem; font-weight: 800; color: #ef4444;
      animation: fadeUp 2s ease-out forwards;
    }

    .display-semaforo { display: flex; align-items: center; gap: 3.5rem; }
    .display-traffic-light {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      background: #0f172a; border-radius: 32px;
      padding: 16px; border: 3px solid #1e293b;
    }
    .dtl-light {
      width: 64px; height: 64px; border-radius: 50%;
      transition: background 0.2s, box-shadow 0.25s;
    }
    .dtl-red    { background: #ef444420; }
    .dtl-yellow { background: #fbbf2420; }
    .dtl-green  { background: #34d39920; }
    .dtl-red.on    { background: #ef4444; box-shadow: 0 0 32px #ef4444cc; }
    .dtl-yellow.on { background: #fbbf24; box-shadow: 0 0 32px #fbbf24cc; }
    .dtl-green.on  { background: #34d399; box-shadow: 0 0 32px #34d399cc; }
    .display-points { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
    .display-points-num {
      font-size: clamp(5rem, 14vw, 9rem);
      font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1;
    }
    .display-points-label { font-size: 1.2rem; color: #6b7280; font-weight: 600; }


    /* Header action buttons (mute + display) */
    .header-actions { display: flex; gap: 0.4rem; align-items: center; }
    .btn-icon-sm {
      background: none; border: 1.5px solid #374151;
      color: #6b7280; border-radius: 8px;
      width: 34px; height: 34px; font-size: 0.95rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-icon-sm:hover { border-color: #a8b4ff; color: #a8b4ff; }
    .btn-icon-sm.muted { border-color: #ef4444; color: #ef4444; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const CIRCUMFERENCE    = 2 * Math.PI * 80;
const NUM_BARS         = 32;
const CALIBRATE_SECS   = 5;
const DB_MIN           = 40;
const DB_MAX           = 90;
const DB_RANGE         = DB_MAX - DB_MIN;
const PUNISH_COOLDOWN  = 8000; // ms between A/C punishments
const ALERT_COOLDOWN   = 10000; // ms between alert beeps

const IS_DISPLAY = new URLSearchParams(window.location.search).has('display');

// ── Suoni sintetizzati ────────────────────────────────────────
function playAlert(ctx) {
  // Beep ascendente breve (soglia superata)
  const t = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(520, t);
  o.frequency.exponentialRampToValueAtTime(900, t + 0.18);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.22, t + 0.04);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + 0.32);
}

function playPunishment(ctx) {
  // Tre impulsi quadri discendenti (penalità applicata)
  const t = ctx.currentTime;
  [0, 0.17, 0.34].forEach((off, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';
    o.frequency.value = 380 - i * 80;
    g.gain.setValueAtTime(0.16, t + off);
    g.gain.exponentialRampToValueAtTime(0.001, t + off + 0.14);
    o.connect(g); g.connect(ctx.destination);
    o.start(t + off); o.stop(t + off + 0.15);
  });
}

function playDone(ctx) {
  // Sequenza discendente a dente di sega (fine sessione / punti esauriti)
  const t = ctx.currentTime;
  [880, 698, 554, 440].forEach((freq, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = freq;
    const s = t + i * 0.24;
    g.gain.setValueAtTime(0.18, s);
    g.gain.exponentialRampToValueAtTime(0.001, s + 0.21);
    o.connect(g); g.connect(ctx.destination);
    o.start(s); o.stop(s + 0.24);
  });
}

function pctToDb(pct) { return DB_MIN + (pct / 100) * DB_RANGE; }
function dbToPct(db)  { return Math.min(100, Math.max(0, ((db - DB_MIN) / DB_RANGE) * 100)); }
function levelColor(pct, thr) {
  if (pct < thr * 0.85) return '#34d399';
  if (pct < thr)        return '#fbbf24';
  return '#ef4444';
}
function fmt(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
}

// ── SVG Meter ────────────────────────────────────────────────
function MeterSVG({ percent, threshold }) {
  const offset = CIRCUMFERENCE * (1 - percent / 100);
  const ang    = (threshold / 100) * 360;
  const rad    = (ang - 90) * (Math.PI / 180);
  const cx = 110, cy = 110, r = 80, tl = 10;
  const tx  = cx + r  * Math.cos(rad), ty  = cy + r  * Math.sin(rad);
  const tx2 = cx + (r+tl) * Math.cos(rad), ty2 = cy + (r+tl) * Math.sin(rad);
  const color = levelColor(percent, threshold);
  return (
    <svg viewBox="0 0 220 220" className="meter-svg">
      <circle className="meter-bg"   cx={cx} cy={cy} r={r} />
      <circle className="meter-fill" cx={cx} cy={cy} r={r}
        stroke={color} strokeDasharray={CIRCUMFERENCE} strokeDashoffset={offset} />
      <line x1={tx} y1={ty} x2={tx2} y2={ty2}
        stroke="rgba(255,255,255,0.5)" strokeWidth="2.5" strokeLinecap="round"
        transform={`rotate(90,${cx},${cy})`} />
    </svg>
  );
}

// ── Setup Screen ──────────────────────────────────────────────
function SetupScreen({ threshold, setThreshold, thresholdPct, onStart }) {
  const [mode, setMode]                     = useState(null);
  const [timerDuration, setTimerDuration]   = useState(20);
  const [penaltySeconds, setPenaltySeconds] = useState(60);
  const [violationDelay, setViolationDelay] = useState(3);
  const [breakDuration, setBreakDuration]   = useState(15);
  const [startingPoints, setStartingPoints] = useState(10);

  const MODES = [
    { id: 'timer',    emoji: '⏱', label: 'Timer Penalità',
      desc: 'Ogni eccesso di rumore aggiunge secondi di penalità alla classe' },
    { id: 'pausa',    emoji: '⏸', label: 'Pausa Bloccata',
      desc: "Il countdown della pausa si ferma finché c'è troppo rumore" },
    { id: 'semaforo', emoji: '🚦', label: 'Semaforo + Punti',
      desc: 'Semaforo visivo; i punti classe calano ad ogni violazione' },
  ];
  const fill = (v, lo, hi) =>
    `linear-gradient(to right,#a8b4ff ${((v-lo)/(hi-lo))*100}%,#16213e ${((v-lo)/(hi-lo))*100}%)`;

  return (
    <div className="app">
      <div className="header">
        <h1>Quiet Monitor</h1>
        <p>Configura la sessione</p>
      </div>

      <div className="setup-card">
        <div className="setup-card-title">Soglia di allerta</div>
        <div className="control-group">
          <div className="control-label">
            <span>Rumore massimo consentito</span><span>{threshold} dB</span>
          </div>
          <input type="range" min={DB_MIN} max={DB_MAX} step="0.5" value={threshold}
            onChange={e => setThreshold(Number(e.target.value))}
            style={{ background: `linear-gradient(to right,#a8b4ff ${thresholdPct}%,#16213e ${thresholdPct}%)` }} />
          <div className="slider-hints"><span>Quiete (40 dB)</span><span>Caos (90 dB)</span></div>
        </div>
      </div>

      <div className="setup-card">
        <div className="setup-card-title">Modalità punizione</div>
        <div className="mode-cards">
          {MODES.map(m => (
            <div key={m.id} className={`mode-card${mode === m.id ? ' selected' : ''}`}
              onClick={() => setMode(m.id)}>
              <div className="mode-emoji">{m.emoji}</div>
              <div>
                <div className="mode-label">{m.label}</div>
                <div className="mode-desc">{m.desc}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {mode && (
        <div className="setup-card">
          <div className="setup-card-title">Parametri</div>
          <div className="control-group">
            <div className="control-label">
              <span>Tolleranza prima della punizione</span><span>{violationDelay}s</span>
            </div>
            <input type="range" min="1" max="10" step="1" value={violationDelay}
              onChange={e => setViolationDelay(Number(e.target.value))}
              style={{ background: fill(violationDelay, 1, 10) }} />
          </div>
          {mode === 'timer' && (<>
            <div className="control-group">
              <div className="control-label">
                <span>Durata conto alla rovescia</span><span>{timerDuration} min</span>
              </div>
              <input type="range" min="1" max="60" step="1" value={timerDuration}
                onChange={e => setTimerDuration(Number(e.target.value))}
                style={{ background: fill(timerDuration, 1, 60) }} />
            </div>
            <div className="control-group">
              <div className="control-label">
                <span>Secondi aggiunti per ogni violazione</span><span>+{penaltySeconds}s</span>
              </div>
              <input type="range" min="10" max="300" step="10" value={penaltySeconds}
                onChange={e => setPenaltySeconds(Number(e.target.value))}
                style={{ background: fill(penaltySeconds, 10, 300) }} />
            </div>
          </>)}
          {mode === 'pausa' && (
            <div className="control-group">
              <div className="control-label">
                <span>Durata pausa da guadagnare</span><span>{breakDuration} min</span>
              </div>
              <input type="range" min="5" max="30" step="5" value={breakDuration}
                onChange={e => setBreakDuration(Number(e.target.value))}
                style={{ background: fill(breakDuration, 5, 30) }} />
            </div>
          )}
          {mode === 'semaforo' && (
            <div className="control-group">
              <div className="control-label">
                <span>Punti iniziali della classe</span><span>{startingPoints}</span>
              </div>
              <input type="range" min="3" max="20" step="1" value={startingPoints}
                onChange={e => setStartingPoints(Number(e.target.value))}
                style={{ background: fill(startingPoints, 3, 20) }} />
            </div>
          )}
        </div>
      )}

      <button className="btn btn-primary" style={{ width: '100%' }} disabled={!mode}
        onClick={() => onStart({ mode, timerDuration, penaltySeconds, violationDelay, breakDuration, startingPoints })}>
        {mode ? 'Avvia sessione →' : 'Scegli una modalità'}
      </button>
    </div>
  );
}

// ── Panel A: Timer Penalità ───────────────────────────────────
function PanelTimer({ remaining, active, done, onStart, flash }) {
  if (!active && !done) {
    return (
      <div className="punish-panel">
        <div className="punish-label">Conto alla rovescia</div>
        <div className="punish-time" style={{ color: '#4b5563' }}>{fmt(remaining)}</div>
        <button className="btn btn-primary" style={{ marginTop: '0.5rem', width: '100%' }}
          onClick={onStart}>
          Avvia conto alla rovescia
        </button>
      </div>
    );
  }
  if (done) {
    return (
      <div className="punish-panel" style={{ borderColor: '#34d39933' }}>
        <div className="punish-label">Penalità completata</div>
        <div className="punish-time text-green">00:00</div>
        <div className="punish-sub">La classe ha scontato la penalità!</div>
      </div>
    );
  }
  return (
    <div className="punish-panel">
      <div className="punish-label">Tempo rimanente</div>
      <div className={`punish-time${flash ? ' flash-red' : ''}`}>{fmt(remaining)}</div>
      {flash != null && (
        <div className="punish-flash-msg" key={remaining}>+{flash}s aggiunti!</div>
      )}
      <div className="punish-sub">Il rumore aumenta il tempo</div>
    </div>
  );
}

// ── Panel B: Pausa Bloccata ───────────────────────────────────
function PanelPausa({ remaining, paused, started, onStart }) {
  if (!started) {
    return (
      <div className="punish-panel">
        <div className="punish-label">Pausa non ancora avviata</div>
        <button className="btn btn-primary" style={{ marginTop: '0.5rem', width: '100%' }}
          onClick={onStart}>
          Avvia countdown pausa
        </button>
      </div>
    );
  }
  return (
    <div className={`punish-panel punish-pausa${paused ? ' blocked' : ''}`}>
      <div className="punish-label">{paused ? '⛔ Pausa bloccata!' : '✓ Pausa in corso'}</div>
      <div className={`punish-time ${paused ? 'text-red' : 'text-green'}`}>{fmt(remaining)}</div>
      <div className="punish-sub">
        {paused
          ? 'Fai silenzio per sbloccare il countdown'
          : 'La classe sta guadagnando la pausa'}
      </div>
    </div>
  );
}

// ── Panel C: Semaforo + Punti ─────────────────────────────────
function PanelSemaforo({ level, thresholdPct, points, startingPoints, flash, onNewSession }) {
  const s = level < thresholdPct * 0.85 ? 'green' : level < thresholdPct ? 'yellow' : 'red';

  if (points === 0) {
    return (
      <div className="punish-panel punish-esauriti">
        <div className="esauriti-icon">⚠️</div>
        <div className="esauriti-title">Punti esauriti!</div>
        <div className="esauriti-msg">
          La classe ha esaurito tutti i {startingPoints} punti.<br />
          È necessario avviare una nuova sessione.
        </div>
        <button className="btn btn-primary" style={{ marginTop: '0.75rem', width: '100%' }}
          onClick={onNewSession}>
          Nuova sessione
        </button>
      </div>
    );
  }

  return (
    <div className="punish-panel punish-semaforo">
      <div className="traffic-light">
        <div className={`tl-light tl-red${s==='red' ? ' on' : ''}`} />
        <div className={`tl-light tl-yellow${s==='yellow' ? ' on' : ''}`} />
        <div className={`tl-light tl-green${s==='green' ? ' on' : ''}`} />
      </div>
      <div className="semaforo-points">
        <div className="punish-label">Punti classe</div>
        <div className="points-display">
          <span className={`points-num${flash ? ' flash-red' : ''}`}>{points}</span>
          <span className="points-total">/{startingPoints}</span>
        </div>
        {flash && <div className="punish-flash-msg" key={points}>−1 punto!</div>}
        <div className="points-dots">
          {Array.from({ length: startingPoints }, (_, i) => (
            <div key={i} className={`point-dot${i < points ? ' filled' : ''}`} />
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Display View (seconda finestra) ──────────────────────────
function DisplayView() {
  const [data, setData] = useState(null);
  const chRef = useRef(null);

  useEffect(() => {
    const ch = new BroadcastChannel('silenzio-display');
    chRef.current = ch;
    ch.onmessage = e => { if (e.data.type === 'STATE') setData(e.data); };
    ch.postMessage({ type: 'REQUEST' });
    return () => ch.close();
  }, []);

  const goFS = () => document.documentElement.requestFullscreen?.();

  if (!data || data.screen !== 'monitor') {
    return (
      <div className="display-screen display-waiting">
        <div className="display-waiting-icon">📡</div>
        <div className="display-waiting-text">In attesa del pannello di controllo…</div>
        <div className="display-waiting-sub">Apri la finestra principale e avvia una sessione</div>
      </div>
    );
  }

  const { mode, level, thresholdPct, status,
    timerRemaining, timerActive, timerFlash,
    breakRemaining, breakStarted, breakPaused,
    points, startingPoints, semaforoFlash } = data;

  const statusColor = status === 'ok' ? '#34d399' : status === 'warn' ? '#fbbf24' : '#ef4444';
  const sem = level < thresholdPct * 0.85 ? 'green' : level < thresholdPct ? 'yellow' : 'red';

  return (
    <div className="display-screen">
      <div className="display-header">
        <div className="display-bar-wrap">
          <div className="display-bar" style={{ width: `${level}%`, background: statusColor }} />
          <div className="display-threshold-tick" style={{ left: `${thresholdPct}%` }} />
        </div>
        <div className="display-db" style={{ color: statusColor }}>{Math.round(pctToDb(level))} dB</div>
      </div>

      <div className={`display-status display-status-${status}`}>
        {status === 'ok' ? 'SILENZIO' : status === 'warn' ? 'ATTENZIONE' : 'TROPPO RUMORE!'}
      </div>

      <div className="display-panel">
        {mode === 'timer' && (<>
          <div className="display-mode-label">Timer Penalità</div>
          {!timerActive
            ? <div className="display-big-time" style={{ color: '#4b5563' }}>{fmt(timerRemaining)}</div>
            : timerRemaining === 0
              ? <div className="display-done">Penalità completata!</div>
              : <div className={`display-big-time${timerFlash ? ' flash-red' : ''}`}>{fmt(timerRemaining)}</div>
          }
          {timerFlash && <div className="display-flash-msg" key={timerRemaining}>+{timerFlash}s aggiunti!</div>}
        </>)}

        {mode === 'pausa' && (<>
          <div className="display-mode-label">
            {!breakStarted ? 'Pausa Bloccata' : breakPaused ? '⛔ Pausa bloccata!' : '✓ Pausa in corso'}
          </div>
          <div className={`display-big-time${breakPaused ? ' text-red' : breakStarted ? ' text-green' : ''}`}
            style={!breakStarted ? { color: '#4b5563' } : {}}>
            {fmt(breakRemaining)}
          </div>
          {breakPaused && <div className="display-sub">Fai silenzio per sbloccare il countdown</div>}
        </>)}

        {mode === 'semaforo' && points === 0 && (<>
          <div className="display-esauriti">⚠️ Punti esauriti!</div>
          <div className="display-sub">Nuova sessione necessaria</div>
        </>)}

        {mode === 'semaforo' && points > 0 && (
          <div className="display-semaforo">
            <div className="display-traffic-light">
              <div className={`dtl-light dtl-red${sem==='red' ? ' on' : ''}`} />
              <div className={`dtl-light dtl-yellow${sem==='yellow' ? ' on' : ''}`} />
              <div className={`dtl-light dtl-green${sem==='green' ? ' on' : ''}`} />
            </div>
            <div className="display-points">
              <div className={`display-points-num${semaforoFlash ? ' flash-red' : ''}`}>{points}</div>
              <div className="display-points-label">/{startingPoints} punti</div>
              {semaforoFlash && <div className="display-flash-msg" key={points}>−1 punto!</div>}
            </div>
          </div>
        )}
      </div>

    </div>
  );
}

// ── App ───────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('setup');

  // Audio
  const [micError, setMicError]       = useState(null);
  const [isListening, setIsListening] = useState(false);
  const [level, setLevel]             = useState(0);
  const [bars, setBars]               = useState(Array(NUM_BARS).fill(0));

  // Shared
  const [threshold, setThreshold]       = useState(51);
  const [calibrating, setCalibrating]   = useState(false);
  const [calCountdown, setCalCountdown] = useState(CALIBRATE_SECS);
  const [calProgress, setCalProgress]   = useState(0);

  // Session config (written at start)
  const [mode, setMode]                     = useState(null);
  const [violationDelay, setViolationDelay] = useState(3);

  // Mode A
  const [penaltySeconds, setPenaltySeconds] = useState(60);
  const [timerDuration, setTimerDuration]   = useState(20);
  const [timerRemaining, setTimerRemaining] = useState(0);
  const [timerActive, setTimerActive]       = useState(false);
  const [timerFlash, setTimerFlash]         = useState(null);

  // Mode B
  const [breakDuration, setBreakDuration]   = useState(15);
  const [breakRemaining, setBreakRemaining] = useState(0);
  const [breakStarted, setBreakStarted]     = useState(false);
  const [breakPaused, setBreakPaused]       = useState(false);

  // Mode C
  const [startingPoints, setStartingPoints] = useState(10);
  const [points, setPoints]                 = useState(10);
  const [semaforoFlash, setSemaforoFlash]   = useState(false);

  // UI
  const [muted, setMuted]               = useState(false);
  const [monitorPaused, setMonitorPaused] = useState(false);

  // Refs (read inside RAF without stale closures)
  const audioCtxRef       = useRef(null);
  const analyserRef       = useRef(null);
  const animFrameRef      = useRef(null);
  const calTimerRef       = useRef(null);
  const calSamplesRef     = useRef([]);
  const streamRef         = useRef(null);
  const thresholdPctRef   = useRef(0);
  const violationStartRef = useRef(null);
  const lastPunishRef     = useRef(0);
  const modeRef           = useRef(null);
  const violDelayRef      = useRef(3);
  const penaltySecRef     = useRef(60);
  const breakPausedRef    = useRef(false);
  const soundCtxRef       = useRef(null);
  const alertCooldownRef  = useRef(0);
  const donePlayedRef     = useRef(false);
  const mutedRef          = useRef(false);
  const monitorPausedRef  = useRef(false);
  const bcRef             = useRef(null);
  const displayStateRef   = useRef({});

  const thresholdPct = dbToPct(threshold);
  const status = level < thresholdPct * 0.85 ? 'ok' : level < thresholdPct ? 'warn' : 'loud';
  const color  = levelColor(level, thresholdPct);

  // Keep refs in sync with state
  useEffect(() => { thresholdPctRef.current = thresholdPct; }, [thresholdPct]);
  useEffect(() => { modeRef.current = mode; },                  [mode]);
  useEffect(() => { violDelayRef.current = violationDelay; },   [violationDelay]);
  useEffect(() => { penaltySecRef.current = penaltySeconds; },  [penaltySeconds]);
  useEffect(() => { breakPausedRef.current = breakPaused; },    [breakPaused]);
  useEffect(() => { mutedRef.current = muted; },                [muted]);
  useEffect(() => { monitorPausedRef.current = monitorPaused; }, [monitorPaused]);

  // BroadcastChannel lifecycle (monitor screen only)
  useEffect(() => {
    if (screen !== 'monitor') return;
    const ch = new BroadcastChannel('silenzio-display');
    bcRef.current = ch;
    ch.onmessage = e => {
      if (e.data.type === 'REQUEST') ch.postMessage({ type: 'STATE', ...displayStateRef.current });
    };
    return () => { ch.close(); bcRef.current = null; };
  }, [screen]);

  // Broadcast state to display window on every relevant change
  useEffect(() => {
    const snap = {
      type: 'STATE', screen, mode, level, thresholdPct, status,
      timerRemaining, timerActive, timerFlash,
      breakRemaining, breakStarted, breakPaused,
      points, startingPoints, semaforoFlash,
    };
    displayStateRef.current = snap;
    bcRef.current?.postMessage(snap);
  }, [level, status, timerRemaining, timerActive, timerFlash,
      breakRemaining, breakStarted, breakPaused, points, semaforoFlash,
      mode, screen, thresholdPct, startingPoints]);

  // "Done" sound (timer=0 or points exhausted) — fires once per session
  useEffect(() => {
    const isDone =
      (mode === 'timer'    && timerActive && timerRemaining === 0) ||
      (mode === 'semaforo' && points === 0);
    if (isDone && !donePlayedRef.current && soundCtxRef.current && !mutedRef.current) {
      donePlayedRef.current = true;
      playDone(soundCtxRef.current);
    }
    if (!isDone) donePlayedRef.current = false;
  }, [mode, timerActive, timerRemaining, points]);

  // Mode A: penalty countdown (1 tick/s)
  useEffect(() => {
    if (mode !== 'timer' || !timerActive || timerRemaining <= 0) return;
    const id = setInterval(() => {
      setTimerRemaining(r => (r <= 1 ? 0 : r - 1));
    }, 1000);
    return () => clearInterval(id);
  }, [mode, timerActive, timerRemaining]);

  // Mode B: break countdown (1 tick/s, pauses via ref)
  useEffect(() => {
    if (mode !== 'pausa' || !breakStarted || breakRemaining <= 0) return;
    const id = setInterval(() => {
      if (!breakPausedRef.current) {
        setBreakRemaining(r => (r <= 1 ? 0 : r - 1));
      }
    }, 1000);
    return () => clearInterval(id);
  }, [mode, breakStarted, breakRemaining]);

  // Punishment actions (stable — reads only from refs/stable setters)
  const triggerPunishment = useCallback(() => {
    const m = modeRef.current;
    if (soundCtxRef.current && !mutedRef.current) playPunishment(soundCtxRef.current);
    if (m === 'timer') {
      const secs = penaltySecRef.current;
      setTimerRemaining(r => r + secs);
      setTimerFlash(secs);
      setTimeout(() => setTimerFlash(null), 2000);
    } else if (m === 'semaforo') {
      setPoints(p => Math.max(0, p - 1));
      setSemaforoFlash(true);
      setTimeout(() => setSemaforoFlash(false), 2000);
    }
  }, []);

  // Audio init
  const startAudio = useCallback(async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      streamRef.current = stream;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtxRef.current = ctx;
      const source   = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.75;
      analyser.minDecibels = -90;
      analyser.maxDecibels = -10;
      source.connect(analyser);
      analyserRef.current = analyser;
      setIsListening(true);
      setMicError(null);
    } catch {
      setMicError('Impossibile accedere al microfono. Controlla i permessi del browser.');
    }
  }, []);

  const stopAudio = useCallback(() => {
    cancelAnimationFrame(animFrameRef.current);
    streamRef.current?.getTracks().forEach(t => t.stop());
    streamRef.current = null;
    audioCtxRef.current?.close();
    audioCtxRef.current = null;
    analyserRef.current = null;
    setIsListening(false);
    setLevel(0);
    setBars(Array(NUM_BARS).fill(0));
  }, []);

  // RAF loop + violation detection
  useEffect(() => {
    if (!isListening || !analyserRef.current) return;
    const analyser = analyserRef.current;
    const data     = new Uint8Array(analyser.frequencyBinCount);

    const tick = () => {
      analyser.getByteFrequencyData(data);

      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
      const pct = Math.min(100, (Math.sqrt(sum / data.length) / 255) * 100);
      setLevel(pct);

      if (calSamplesRef.current !== null && calibrating) {
        calSamplesRef.current.push(pct);
      }

      // Violation detection
      const thr = thresholdPctRef.current;
      const m   = modeRef.current;
      if (m && !monitorPausedRef.current) {
        if (pct >= thr) {
          if (!violationStartRef.current) {
            violationStartRef.current = Date.now();
            const now = Date.now();
            if (soundCtxRef.current && !mutedRef.current && now - alertCooldownRef.current > ALERT_COOLDOWN) {
              alertCooldownRef.current = now;
              playAlert(soundCtxRef.current);
            }
          }
          const elapsed = (Date.now() - violationStartRef.current) / 1000;
          if (elapsed >= violDelayRef.current) {
            if (m === 'pausa') {
              setBreakPaused(true);
            } else {
              const now = Date.now();
              if (now - lastPunishRef.current > PUNISH_COOLDOWN) {
                lastPunishRef.current = now;
                triggerPunishment();
              }
            }
          }
        } else {
          violationStartRef.current = null;
          if (m === 'pausa') setBreakPaused(false);
        }
      }

      // Bar chart
      const step = Math.floor(data.length / NUM_BARS);
      setBars(Array.from({ length: NUM_BARS }, (_, i) => {
        const slice = data.slice(i * step, (i + 1) * step);
        return Math.min(100, (slice.reduce((a, b) => a + b, 0) / slice.length / 255) * 100);
      }));

      animFrameRef.current = requestAnimationFrame(tick);
    };

    animFrameRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(animFrameRef.current);
  }, [isListening, calibrating, triggerPunishment]);

  // Calibration timer
  useEffect(() => {
    if (!calibrating) return;
    calSamplesRef.current = [];
    setCalCountdown(CALIBRATE_SECS);
    setCalProgress(0);
    const start = Date.now(), total = CALIBRATE_SECS * 1000;
    calTimerRef.current = setInterval(() => {
      const elapsed = Date.now() - start;
      setCalCountdown(Math.max(0, CALIBRATE_SECS - Math.floor(elapsed / 1000)));
      setCalProgress(Math.min(100, (elapsed / total) * 100));
      if (elapsed >= total) {
        clearInterval(calTimerRef.current);
        const s = calSamplesRef.current;
        if (s.length > 0) {
          const avgDb = pctToDb(s.reduce((a, b) => a + b, 0) / s.length);
          setThreshold(Math.min(DB_MAX - 1, Math.max(DB_MIN + 2, Math.round(avgDb + 10))));
        }
        calSamplesRef.current = null;
        setCalibrating(false);
      }
    }, 100);
    return () => clearInterval(calTimerRef.current);
  }, [calibrating]);

  // Session start
  const handleStart = useCallback(({ mode: m, timerDuration: td, penaltySeconds: ps,
      violationDelay: vd, breakDuration: bd, startingPoints: sp }) => {
    setMode(m); setPenaltySeconds(ps); setViolationDelay(vd);
    setTimerDuration(td); setTimerRemaining(td * 60); setTimerActive(false);
    setBreakDuration(bd); setBreakRemaining(bd * 60);
    setStartingPoints(sp); setPoints(sp);
    setBreakStarted(false); setBreakPaused(false);
    violationStartRef.current = null; lastPunishRef.current = 0;
    alertCooldownRef.current = 0; donePlayedRef.current = false;
    if (!soundCtxRef.current) {
      soundCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    }
    setScreen('monitor');
    startAudio();
  }, [startAudio]);

  const handleBackToSetup = () => {
    stopAudio();
    if (calibrating) { clearInterval(calTimerRef.current); setCalibrating(false); }
    setMonitorPaused(false);
    setScreen('setup'); setMode(null);
  };

  // ── Setup screen ──────────────────────────────────────────
  if (screen === 'setup') {
    return <SetupScreen threshold={threshold} setThreshold={setThreshold}
      thresholdPct={thresholdPct} onStart={handleStart} />;
  }

  // ── Monitor screen ────────────────────────────────────────
  return (
    <div className="app">
      <div className="monitor-header">
        <div className="header" style={{ textAlign: 'left', flex: 1 }}>
          <h1>Quiet Monitor</h1>
          <p style={{ fontSize: '0.82rem', color: '#6b7280', marginTop: '0.25rem' }}>
            {mode === 'timer' ? 'Timer Penalità' : mode === 'pausa' ? 'Pausa Bloccata' : 'Semaforo + Punti'}
          </p>
        </div>
        <div className="header-actions">
          <button className={`btn-icon-sm${monitorPaused ? ' muted' : ''}`}
            onClick={() => { setMonitorPaused(p => !p); violationStartRef.current = null; }}
            title={monitorPaused ? 'Riprendi monitoraggio' : 'Metti in pausa il monitoraggio'}>
            {monitorPaused ? '▶' : '⏸'}
          </button>
          <button className={`btn-icon-sm${muted ? ' muted' : ''}`}
            onClick={() => setMuted(m => !m)}
            title={muted ? 'Riattiva suoni' : 'Silenzia suoni'}>
            {muted ? '🔇' : '🔊'}
          </button>
          <button className="btn-icon-sm"
            onClick={() => {
              const u = new URL(window.location.href);
              u.searchParams.set('display','1');
              window.open(u.toString(), '_blank');
            }}
            title="Apri display seconda finestra">⛶</button>
          <button className="btn-icon" onClick={handleBackToSetup} title="Torna al setup">✕</button>
        </div>
      </div>

      {micError && (
        <div className="mic-error"><strong>Accesso microfono negato</strong>{micError}</div>
      )}

      <div className="meter-wrap">
        <MeterSVG percent={level} threshold={thresholdPct} />
        <div className="meter-center">
          <span className="meter-db">{isListening ? Math.round(pctToDb(level)) : '—'}</span>
          <span className="meter-label">dB</span>
          {isListening && (
            <span className={`meter-status ${status}`}>
              {status === 'ok' ? 'Silenzio' : status === 'warn' ? 'Attenzione' : 'Troppo rumore!'}
            </span>
          )}
        </div>
      </div>

      <div className="bars">
        {bars.map((h, i) => (
          <div key={i} className="bar"
            style={{ height: `${Math.max(2, h * 0.4)}px`, background: color, opacity: 0.6 + (h/100)*0.4 }} />
        ))}
      </div>

      {mode === 'timer' && (
        <PanelTimer
          remaining={timerRemaining}
          active={timerActive}
          done={timerActive && timerRemaining === 0}
          onStart={() => setTimerActive(true)}
          flash={timerFlash}
        />
      )}
      {mode === 'pausa' && (
        <PanelPausa remaining={breakRemaining} paused={breakPaused}
          started={breakStarted} onStart={() => setBreakStarted(true)} />
      )}
      {mode === 'semaforo' && (
        <PanelSemaforo level={level} thresholdPct={thresholdPct}
          points={points} startingPoints={startingPoints} flash={semaforoFlash}
          onNewSession={handleBackToSetup} />
      )}

      {calibrating && (
        <div className="calibrate-info">
          <div className="calibrate-countdown">{calCountdown}</div>
          <div style={{ flex: 1 }}>
            <div className="calibrate-text">
              Ascolto ambiente in corso…<br />Mantieni il silenzio normale della classe.
            </div>
            <div style={{ marginTop: '0.5rem' }}>
              <div className="calibrate-bar-wrap">
                <div className="calibrate-bar" style={{ width: `${calProgress}%` }} />
              </div>
            </div>
          </div>
        </div>
      )}

      <div className="monitor-footer">
        <div className="control-group" style={{ flex: 1 }}>
          <div className="control-label"><span>Soglia</span><span>{threshold} dB</span></div>
          <input type="range" min={DB_MIN} max={DB_MAX} step="0.5" value={threshold}
            onChange={e => setThreshold(Number(e.target.value))}
            style={{ background: `linear-gradient(to right,#a8b4ff ${thresholdPct}%,#16213e ${thresholdPct}%)` }} />
        </div>
        <button className={`btn btn-calibrate${calibrating ? ' running' : ''}`}
          onClick={() => isListening && !calibrating && setCalibrating(true)}
          disabled={calibrating}>
          {calibrating ? 'Calibrazione…' : 'Calibra'}
        </button>
      </div>

      <p className="footer-note">Il microfono viene usato solo localmente. Nessun dato viene trasmesso.</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  IS_DISPLAY ? <DisplayView /> : <App />
);
</script>
</body>
</html>
